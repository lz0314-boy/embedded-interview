<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="面向嵌入式软件秋招的个人面试复习工作台，覆盖简历项目、C/RTOS/Linux/CAN 与调试方法。">
  <meta name="theme-color" content="#f5f7f8">
  <title>嵌入式面试作战台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css?v=15">
  <script src="js/lucide.min.js?v=0.468.0" defer></script>
  <script src="js/data.js?v=12" defer></script>
  <script src="js/data_resume.js?v=19" defer></script>
  <script src="js/data_rtthread.js?v=12" defer></script>
  <script src="js/data_linux_lab.js?v=12" defer></script>
  <script src="js/data_supplement.js?v=12" defer></script>
  <script src="js/app.js?v=12" defer></script>
  <script src="js/ai-assistant.js?v=3" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand">
        <button class="brand-mark" data-route="dashboard" aria-label="返回复习台">EI</button>
        <div>
          <strong>嵌入式面试作战台</strong>
          <span>2026 秋招个人版</span>
        </div>
        <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="关闭导航" title="关闭导航">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="sidebar-progress">
        <div class="progress-copy">
          <span>总掌握度</span>
          <strong id="sidebarProgressText">0%</strong>
        </div>
        <div class="progress-track" aria-hidden="true"><span id="sidebarProgressBar"></span></div>
        <div class="progress-meta"><span id="sidebarMastered">0 已掌握</span><span id="sidebarTotal">0 题</span></div>
      </div>

      <nav class="main-nav">
        <button class="nav-item active" data-route="dashboard"><i data-lucide="layout-dashboard"></i><span>今日复习</span></button>
        <button class="nav-item" data-route="library"><i data-lucide="library-big"></i><span>全部题库</span></button>
        <button class="nav-item" data-route="flashcard"><i data-lucide="layers-3"></i><span>闪卡训练</span><kbd>F</kbd></button>
        <button class="nav-item" data-route="mock"><i data-lucide="messages-square"></i><span>模拟面试</span><kbd>M</kbd></button>
        <button class="nav-item" data-route="bookmarks"><i data-lucide="bookmark"></i><span>重点收藏</span></button>
      </nav>

      <div class="nav-separator"><span>简历专项</span></div>
      <nav class="category-nav" id="resumeNav"></nav>
      <div class="nav-separator"><span>基础知识</span></div>
      <nav class="category-nav" id="foundationNav"></nav>

      <div class="sidebar-footer">
        <button class="nav-item" id="exportBtn"><i data-lucide="download"></i><span>导出学习记录</span></button>
        <button class="nav-item" id="themeToggle"><i data-lucide="moon"></i><span>切换主题</span></button>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开导航" title="打开导航"><i data-lucide="menu"></i></button>
        <div class="search-box" id="searchBox">
          <i data-lucide="search"></i>
          <input id="searchInput" type="search" autocomplete="off" placeholder="搜索问题、项目、知识点" aria-label="搜索题库">
          <kbd>Ctrl K</kbd>
          <button class="icon-btn search-clear" id="searchClear" aria-label="清除搜索" title="清除搜索"><i data-lucide="x"></i></button>
        </div>
        <div class="topbar-actions">
          <button class="text-btn ai-launch-btn" id="aiLaunchBtn" aria-label="打开 AI 面试助手" title="打开 AI 面试助手">
            <i data-lucide="sparkles"></i><span>AI 助手</span>
            <span class="ai-status-dot" id="aiStatusDot" aria-hidden="true"></span>
          </button>
          <button class="text-btn" id="randomBtn"><i data-lucide="shuffle"></i><span>随机一题</span></button>
          <button class="icon-btn" id="focusBtn" aria-label="进入闪卡训练" title="进入闪卡训练"><i data-lucide="timer-reset"></i></button>
        </div>
      </header>

      <main class="main" id="mainContent" tabindex="-1"></main>
    </div>
  </div>

  <div class="ai-scrim" id="aiScrim"></div>
  <aside class="ai-drawer" id="aiDrawer" aria-label="AI 面试助手" aria-hidden="true">
    <div class="ai-resize-handle" id="aiResizeHandle" role="separator" aria-orientation="vertical" aria-label="调整 AI 助手宽度" title="拖动调整宽度"></div>
    <header class="ai-drawer-header">
      <div class="ai-title">
        <span class="ai-avatar"><i data-lucide="bot"></i></span>
        <div><strong>廖洲 AI</strong><span id="aiConnectionText">未连接</span></div>
      </div>
      <div class="ai-header-actions">
        <button class="icon-btn" id="aiSettingsBtn" aria-label="连接设置" title="连接设置"><i data-lucide="settings-2"></i></button>
        <button class="icon-btn" id="aiClearBtn" aria-label="清空对话" title="清空对话"><i data-lucide="trash-2"></i></button>
        <button class="icon-btn" id="aiCloseBtn" aria-label="关闭 AI 助手" title="关闭 AI 助手"><i data-lucide="x"></i></button>
      </div>
    </header>

    <div class="ai-mode-tabs" role="tablist" aria-label="对话模式">
      <button class="active" data-ai-mode="answer" role="tab" aria-selected="true"><i data-lucide="message-circle-question"></i>答疑</button>
      <button data-ai-mode="mock" role="tab" aria-selected="false"><i data-lucide="messages-square"></i>模拟</button>
      <button data-ai-mode="review" role="tab" aria-selected="false"><i data-lucide="scan-text"></i>点评</button>
    </div>

    <section class="ai-settings" id="aiSettings" hidden>
      <div class="ai-settings-head">
        <strong>连接设置</strong>
        <button class="icon-btn" id="aiSettingsCloseBtn" aria-label="关闭设置" title="关闭设置"><i data-lucide="chevron-up"></i></button>
      </div>
      <label for="aiBackendUrl">后端地址</label>
      <input id="aiBackendUrl" type="url" inputmode="url" autocomplete="url" placeholder="https://your-service.example.com">
      <label for="aiProviderBaseUrl">API 请求地址</label>
      <input id="aiProviderBaseUrl" type="url" inputmode="url" autocomplete="url" placeholder="https://api.example.com/v1">
      <div class="ai-provider-row">
        <div>
          <label for="aiProviderModel">模型</label>
          <input id="aiProviderModel" type="text" autocomplete="off" placeholder="服务商提供的模型名">
        </div>
        <div>
          <label for="aiProviderMode">接口协议</label>
          <select id="aiProviderMode">
            <option value="chat_completions">Chat Completions</option>
            <option value="responses">Responses</option>
          </select>
        </div>
      </div>
      <label for="aiAccessToken">访问令牌</label>
      <div class="ai-token-field">
      <input id="aiAccessToken" type="password" autocomplete="current-password" placeholder="本地模式可留空，公网模式必填">
        <button class="icon-btn" id="aiTokenToggle" type="button" aria-label="显示访问令牌" title="显示访问令牌"><i data-lucide="eye"></i></button>
      </div>
      <div class="ai-settings-actions">
        <span id="aiSettingsStatus" role="status"></span>
        <button class="secondary-btn" id="aiTestBtn" type="button"><i data-lucide="activity"></i>测试</button>
        <button class="primary-btn" id="aiSaveBtn" type="button"><i data-lucide="save"></i>保存</button>
      </div>
    </section>

    <div class="ai-messages" id="aiMessages" aria-live="polite"></div>

    <footer class="ai-composer">
      <div class="ai-input-wrap">
        <textarea id="aiInput" rows="1" maxlength="4000" placeholder="输入简历、项目或嵌入式问题"></textarea>
        <button class="ai-send-btn" id="aiSendBtn" aria-label="发送问题" title="发送问题"><i data-lucide="send"></i></button>
      </div>
      <div class="ai-composer-meta"><span id="aiModeHint">答疑模式</span><span id="aiCharCount">0 / 4000</span></div>
    </footer>
  </aside>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>

  <dialog class="interview-dialog" id="interviewDialog">
    <div class="dialog-header">
      <div><span class="eyebrow">MOCK INTERVIEW</span><h2>模拟面试设置</h2></div>
      <button class="icon-btn" data-close-dialog aria-label="关闭" title="关闭"><i data-lucide="x"></i></button>
    </div>
    <form id="mockSetupForm" method="dialog">
      <label class="field-label" for="mockScope">题目范围</label>
      <select id="mockScope" class="field-control">
        <option value="resume">简历与项目</option>
        <option value="foundation">嵌入式基础</option>
        <option value="all">全部题库</option>
      </select>
      <label class="field-label" for="mockCount">题目数量</label>
      <div class="segmented" id="mockCount" role="radiogroup" aria-label="题目数量">
        <label><input type="radio" name="mockCount" value="5" checked><span>5 题</span></label>
        <label><input type="radio" name="mockCount" value="10"><span>10 题</span></label>
        <label><input type="radio" name="mockCount" value="15"><span>15 题</span></label>
      </div>
      <div class="dialog-actions">
        <button type="button" class="secondary-btn" data-close-dialog>取消</button>
        <button type="submit" class="primary-btn"><i data-lucide="play"></i>开始面试</button>
      </div>
    </form>
  </dialog>

  <input id="importInput" type="file" accept="application/json" hidden>
</body>
</html>
